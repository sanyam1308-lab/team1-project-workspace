openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: problem
    description: Problem statement cards
  - name: ideas
    description: Brainstorm board ideas
  - name: plan
    description: Project plan weeks and tasks
  - name: qc
    description: QC Agent — Tableau pull, deviation detection, Claude root-cause reasoning
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /problem-cards:
    get:
      operationId: listProblemCards
      tags: [problem]
      summary: List problem statement cards
      responses:
        "200":
          description: List of problem cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProblemCard"
  /problem-cards/{key}:
    patch:
      operationId: updateProblemCard
      tags: [problem]
      summary: Update a problem card's content
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemCardUpdate"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemCard"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ideas:
    get:
      operationId: listIdeas
      tags: [ideas]
      summary: List brainstorm ideas sorted by votes
      responses:
        "200":
          description: List of ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Idea"
    post:
      operationId: createIdea
      tags: [ideas]
      summary: Add a new idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaInput"
      responses:
        "201":
          description: Created idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
  /ideas/{id}:
    delete:
      operationId: deleteIdea
      tags: [ideas]
      summary: Remove an idea
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ideas/{id}/upvote:
    post:
      operationId: upvoteIdea
      tags: [ideas]
      summary: Upvote an idea
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /plan:
    get:
      operationId: getPlan
      tags: [plan]
      summary: Get the full project plan with weeks, tasks, and progress
      responses:
        "200":
          description: The project plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
  /plan/reset:
    post:
      operationId: resetPlan
      tags: [plan]
      summary: Reset the plan to the three empty default weeks
      responses:
        "200":
          description: The reset project plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
  /tasks:
    post:
      operationId: createTask
      tags: [plan]
      summary: Add a task to a week
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [plan]
      summary: Update a task's fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTask
      tags: [plan]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /qc/test-connection:
    post:
      operationId: testQcConnection
      tags: [qc]
      summary: Sign in to Tableau and return the available field list
      responses:
        "200":
          description: Connection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcConnectionStatus"
  /qc/config:
    get:
      operationId: listQcMetrics
      tags: [qc]
      summary: List the monitored metric configurations
      responses:
        "200":
          description: List of monitored metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QcMetric"
    post:
      operationId: createQcMetric
      tags: [qc]
      summary: Add a monitored metric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QcMetricInput"
      responses:
        "201":
          description: Created metric
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcMetric"
  /qc/config/{id}:
    patch:
      operationId: updateQcMetric
      tags: [qc]
      summary: Update a monitored metric
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QcMetricUpdate"
      responses:
        "200":
          description: Updated metric
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcMetric"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteQcMetric
      tags: [qc]
      summary: Delete a monitored metric
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /qc/run:
    post:
      operationId: runQcAgent
      tags: [qc]
      summary: Run the QC agent once now (manual trigger)
      responses:
        "200":
          description: Run result with any detected deviations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcRunResult"
  /qc/runs:
    get:
      operationId: listQcRuns
      tags: [qc]
      summary: List recent agent runs (most recent first)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Recent runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QcRun"
  /qc/deviations:
    get:
      operationId: listQcDeviations
      tags: [qc]
      summary: List recent deviations (most recent first)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Recent deviations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QcDeviation"
  /tableau-webhook:
    post:
      operationId: tableauWebhook
      tags: [qc]
      summary: Webhook endpoint that triggers an agent run (e.g. Tableau refresh succeeded)
      responses:
        "200":
          description: Run result with any detected deviations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcRunResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ProblemCard:
      type: object
      required: [key, label, content]
      properties:
        key:
          type: string
        label:
          type: string
        content:
          type: string
    ProblemCardUpdate:
      type: object
      required: [content]
      properties:
        content:
          type: string
    Idea:
      type: object
      required: [id, text, author, votes, createdAt]
      properties:
        id:
          type: integer
        text:
          type: string
        author:
          type: string
        votes:
          type: integer
        createdAt:
          type: string
          format: date-time
    IdeaInput:
      type: object
      required: [text, author]
      properties:
        text:
          type: string
          minLength: 1
        author:
          type: string
          minLength: 1
    Task:
      type: object
      required: [id, weekNumber, name, owner, targetDate, done, position]
      properties:
        id:
          type: integer
        weekNumber:
          type: integer
        name:
          type: string
        owner:
          type: string
        targetDate:
          type: string
        done:
          type: boolean
        position:
          type: integer
    TaskInput:
      type: object
      required: [weekNumber]
      properties:
        weekNumber:
          type: integer
          minimum: 1
          maximum: 3
        name:
          type: string
        owner:
          type: string
        targetDate:
          type: string
    TaskUpdate:
      type: object
      properties:
        name:
          type: string
        owner:
          type: string
        targetDate:
          type: string
        done:
          type: boolean
    Week:
      type: object
      required: [number, title, dateRange, theme, tasks, doneCount, totalCount]
      properties:
        number:
          type: integer
        title:
          type: string
        dateRange:
          type: string
        theme:
          type: string
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        doneCount:
          type: integer
        totalCount:
          type: integer
    Plan:
      type: object
      required: [weeks, totalTasks, doneTasks, percentComplete]
      properties:
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/Week"
        totalTasks:
          type: integer
        doneTasks:
          type: integer
        percentComplete:
          type: integer
    QcField:
      type: object
      required: [fieldName, fieldCaption]
      properties:
        fieldName:
          type: string
        fieldCaption:
          type: string
        dataType:
          type: string
    QcConnectionStatus:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
        datasourceName:
          type: string
        fieldCount:
          type: integer
        fields:
          type: array
          items:
            $ref: "#/components/schemas/QcField"
        error:
          type: string
    QcMetric:
      type: object
      required:
        [id, measureField, aggregation, dimensionField, thresholdPct, createdAt]
      properties:
        id:
          type: integer
        measureField:
          type: string
        aggregation:
          type: string
        dimensionField:
          type: string
        thresholdPct:
          type: number
        createdAt:
          type: string
          format: date-time
    QcMetricInput:
      type: object
      required: [measureField]
      properties:
        measureField:
          type: string
          minLength: 1
        aggregation:
          type: string
        dimensionField:
          type: string
        thresholdPct:
          type: number
          minimum: 0
    QcMetricUpdate:
      type: object
      properties:
        measureField:
          type: string
          minLength: 1
        aggregation:
          type: string
        dimensionField:
          type: string
        thresholdPct:
          type: number
          minimum: 0
    QcRun:
      type: object
      required:
        [id, trigger, status, message, metricsPulled, deviationsFound, startedAt]
      properties:
        id:
          type: integer
        trigger:
          type: string
        status:
          type: string
        message:
          type: string
        metricsPulled:
          type: integer
        deviationsFound:
          type: integer
        startedAt:
          type: string
          format: date-time
    QcDeviation:
      type: object
      required:
        [
          id,
          runId,
          metricKey,
          measureField,
          dimensionValue,
          reason,
          likelyCause,
          confidence,
          explanation,
          recommendedCheck,
          createdAt,
        ]
      properties:
        id:
          type: integer
        runId:
          type: integer
        metricKey:
          type: string
        measureField:
          type: string
        dimensionValue:
          type: string
        previousValue:
          type: [number, "null"]
        currentValue:
          type: [number, "null"]
        pctChange:
          type: [number, "null"]
        reason:
          type: string
        likelyCause:
          type: string
        confidence:
          type: string
        explanation:
          type: string
        recommendedCheck:
          type: string
        createdAt:
          type: string
          format: date-time
    QcRunResult:
      type: object
      required: [run, deviations]
      properties:
        run:
          $ref: "#/components/schemas/QcRun"
        deviations:
          type: array
          items:
            $ref: "#/components/schemas/QcDeviation"
